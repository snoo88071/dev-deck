[package]
name = "dev-deck"
version = "0.1.0"
description = "A Windows tray panel for your development processes"
license = "MIT"
edition = "2021"
default-run = "dev-deck"

[lib]
name = "dev_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
netstat2 = "0.11.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sys-locale = "0.3.2"
sysinfo = "0.39.6"
tauri = { version = "2.11.6", features = ["tray-icon", "image-png"] }

# The Task Scheduler's COM API (tasks.rs). Same version Tauri already builds.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_TaskScheduler", "Win32_System_Variant"] }
