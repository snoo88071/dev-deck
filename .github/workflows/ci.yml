name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm ci
        working-directory: mcp

      - name: Rust
        run: cargo test && cargo build --bin devdeck
        working-directory: src-tauri
      - name: Cleanup rules and translations
        run: node --test ui/cleanup.test.js ui/locales.test.js
      - name: Panel build (types and bundle)
        run: npm run ui:build
      - name: Panel in Playwright (demo), contrast in both themes
        run: npx playwright install chromium && npm run ui-check && npm run contrast
      - name: MCP (and the plugin bundle is up to date)
        run: npm run check && npm run bundle && git diff --exit-code -- dist && npm test
        working-directory: mcp
